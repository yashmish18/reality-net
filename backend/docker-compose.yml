version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: realitynet
      POSTGRES_PASSWORD: realitynet123
      POSTGRES_DB: realitynet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realitynet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

